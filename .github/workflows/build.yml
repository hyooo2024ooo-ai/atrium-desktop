name: build

on:
  push:
    branches: [main, game-mode-fullscreen]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build native, settings and the portable package
        shell: pwsh
        run: ./tools/build.ps1 -Zip
      - uses: actions/upload-artifact@v7
        with:
          name: Atrium-win-x64
          path: dist/*.zip
          if-no-files-found: error
